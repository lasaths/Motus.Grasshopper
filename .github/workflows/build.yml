name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Motus.NET lives as a sibling of Motus.Grasshopper (see build/MotusNetLocal.props).
# Checkout both so CI can UseLocal until/unless the MotusNetVersion NuGet package is on nuget.org.
defaults:
  run:
    working-directory: Motus.Grasshopper

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Motus.Grasshopper

      - name: Checkout Motus.NET (sibling)
        uses: actions/checkout@v4
        with:
          repository: lasaths/Motus.NET
          path: Motus.NET
          ref: master

      - name: Apply Motus.NET 0.12 patch series
        shell: bash
        run: |
          patch_dir="$PWD/patches/motus-net-0.12.0"
          git -C ../Motus.NET config user.name "github-actions"
          git -C ../Motus.NET config user.email "github-actions@users.noreply.github.com"
          for p in "$patch_dir"/*.patch; do
            echo "Applying $p"
            git -C ../Motus.NET am --3way "$p"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Motus.GH (net8.0-windows)
        run: dotnet build src/Motus.GH/Motus.GH.csproj -c Release -p:UseMotusNetProjectReference=true

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Motus.Grasshopper

      - name: Checkout Motus.NET (sibling)
        uses: actions/checkout@v4
        with:
          repository: lasaths/Motus.NET
          path: Motus.NET
          ref: master

      - name: Apply Motus.NET 0.12 patch series
        shell: bash
        run: |
          patch_dir="$PWD/patches/motus-net-0.12.0"
          git -C ../Motus.NET config user.name "github-actions"
          git -C ../Motus.NET config user.email "github-actions@users.noreply.github.com"
          for p in "$patch_dir"/*.patch; do
            echo "Applying $p"
            git -C ../Motus.NET am --3way "$p"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Motus.GH (net8.0)
        run: dotnet build src/Motus.GH/Motus.GH.csproj -c Release -f net8.0 -p:UseMotusNetProjectReference=true

  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Motus.Grasshopper

      - name: Checkout Motus.NET (sibling)
        uses: actions/checkout@v4
        with:
          repository: lasaths/Motus.NET
          path: Motus.NET
          ref: master

      - name: Apply Motus.NET 0.12 patch series
        shell: bash
        run: |
          patch_dir="$PWD/patches/motus-net-0.12.0"
          git -C ../Motus.NET config user.name "github-actions"
          git -C ../Motus.NET config user.email "github-actions@users.noreply.github.com"
          for p in "$patch_dir"/*.patch; do
            echo "Applying $p"
            git -C ../Motus.NET am --3way "$p"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Grasshopper .gha build requires Rhino 8 on the machine — run ./build.ps1 locally.
      - name: Fetch UR10e example meshes
        run: node scripts/fetch-ur10e-assets.mjs

      - name: Regenerate + validate example GHX
        run: |
          node scripts/generate-examples.mjs
          git diff --exit-code -- examples/*.ghx
          node scripts/validate-ghx.mjs

      - name: Planner-only dependency fence
        shell: bash
        run: |
          if rg -n -i "(rtde|socket|tcpclient|udpclient|serialport|modbus|opcua|robot command)" src/Motus.GH; then
            echo "Planner-only fence failed: control transport dependency detected."
            exit 1
          fi

      # Compiles against NuGet RhinoCommon (ref-only). Runtime loads Rhino 8 System\RhinoCommon.dll.
      - name: Build QA smoke
        run: dotnet build scripts/qa-smoke/QaSmoke.csproj -c Release -p:UseMotusNetProjectReference=true

      - name: QA smoke (requires Rhino 8 install)
        shell: pwsh
        run: |
          $candidates = @()
          if ($env:Rhino8Dir) { $candidates += (Join-Path $env:Rhino8Dir 'System\RhinoCommon.dll') }
          $candidates += (Join-Path ${env:ProgramFiles} 'Rhino 8\System\RhinoCommon.dll')
          $rhino = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $rhino) {
            Write-Host '::notice title=qa-smoke skipped::No Rhino 8 on this runner — validate-ghx + compile only. REQUIRED before Rhino-touching releases: ./scripts/verify-qa.ps1 -Configuration Release -Install (or dotnet run --project scripts/qa-smoke/QaSmoke.csproj -c Release) on a machine with Rhino 8 / Rhino8Dir.'
            exit 0
          }
          Write-Host "Using RhinoCommon: $rhino"
          dotnet run --project scripts/qa-smoke/QaSmoke.csproj -c Release --no-build
